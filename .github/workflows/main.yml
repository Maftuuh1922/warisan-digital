name: Auto Notification Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  send-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Commit Info & Set Time
        run: |
          echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s')"                    >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')"                >> $GITHUB_ENV
          echo "COMMIT_EMAIL=$(git log -1 --pretty=format:'%ae')"                 >> $GITHUB_ENV
          echo "CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%H:%M - %d/%m/%Y')"       >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)"                           >> $GITHUB_ENV
          echo "TOTAL_COMMITS=$(git rev-list --count HEAD)"                        >> $GITHUB_ENV
          echo "FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | wc -l | tr -d ' ')" >> $GITHUB_ENV
          echo "FILES_LIST<<EOF"                                                   >> $GITHUB_ENV
          git diff --name-only HEAD~1 HEAD | head -10 | sed 's/^/  • /'           >> $GITHUB_ENV
          echo "EOF"                                                               >> $GITHUB_ENV
          echo "LINES_ADDED=$(git diff --stat HEAD~1 HEAD | tail -1 | grep -oP '\d+ insertion' | grep -oP '\d+' || echo '0')"   >> $GITHUB_ENV
          echo "LINES_DELETED=$(git diff --stat HEAD~1 HEAD | tail -1 | grep -oP '\d+ deletion' | grep -oP '\d+' || echo '0')"  >> $GITHUB_ENV

      - name: Send Success Notification to Telegram
        run: |
          MESSAGE="✅ *BUILD SUCCESSFUL*
          ━━━━━━━━━━━━━━━━━━━━━━
          🗂 *Project:* BatikLens — AI Batik Classifier
          ⚙️ *Component:* Backend \`(API \& Model AI)\`
          🌿 *Branch:* \`${{ github.ref_name }}\`
          🔖 *Commit:* [\`${{ env.SHORT_SHA }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          🕐 *Build Time:* ${{ env.CURRENT_TIME }} WIB
          🔢 *Total Commits:* ${{ env.TOTAL_COMMITS }}

          ━━━━━━━━━━━━━━━━━━━━━━
          📝 *Update Details*
          💬 *Message:* ${{ env.COMMIT_MSG }}
          👤 *Author:* ${{ env.COMMIT_AUTHOR }}
          📤 *Pushed by:* ${{ github.actor }}

          ━━━━━━━━━━━━━━━━━━━━━━
          📊 *Change Stats*
          📁 *Files Changed:* ${{ env.FILES_CHANGED }} file(s)
          ➕ *Lines Added:* +${{ env.LINES_ADDED }}
          ➖ *Lines Deleted:* -${{ env.LINES_DELETED }}

          🗒 *Modified Files:*
          ${{ env.FILES_LIST }}

          ━━━━━━━━━━━━━━━━━━━━━━
          ⚠️ *Notes for Team*
          1\. Cek update pada sistem klasifikasi \(MobileNetV2\) atau endpoint API\.
          2\. Pastikan cek Log Console jika ada error saat memanggil API\.
          3\. Bug? Lapor ke Grup — ❌ jangan PM Admin\.

          🔗 [Lihat Repository](https://github.com/${{ github.repository }}) \| [Lihat Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) \| [Action Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ━━━━━━━━━━━━━━━━━━━━━━
          _By: Maftuh \& Syabilla_ 🚀"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview="true" \
            -d text="$MESSAGE"

      - name: Send Failure Notification to Telegram
        if: failure()
        run: |
          MESSAGE="❌ *BUILD FAILED\!*
          ━━━━━━━━━━━━━━━━━━━━━━
          🗂 *Project:* BatikLens — AI Batik Classifier
          ⚙️ *Component:* Backend \`\(API \& Model AI\)\`
          🌿 *Branch:* \`${{ github.ref_name }}\`
          🔖 *Commit:* [\`${{ env.SHORT_SHA }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          🕐 *Time:* ${{ env.CURRENT_TIME }} WIB

          ━━━━━━━━━━━━━━━━━━━━━━
          📝 *Last Commit*
          💬 *Message:* ${{ env.COMMIT_MSG }}
          👤 *Author:* ${{ env.COMMIT_AUTHOR }}
          📤 *Pushed by:* ${{ github.actor }}

          ━━━━━━━━━━━━━━━━━━━━━━
          🔍 *Action Required*
          Segera cek log build untuk mengetahui penyebab error\.

          🔗 [Lihat Error Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ━━━━━━━━━━━━━━━━━━━━━━
          _By: Maftuh \& Syabilla_ ⚠️"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview="true" \
            -d text="$MESSAGE"
